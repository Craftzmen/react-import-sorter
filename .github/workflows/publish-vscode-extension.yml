name: Publish Extension to Marketplace

on:
  push:
    tags:
      - 'vscode-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build

      - name: Pack core package
        run: npm pack

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Install local core package into extension
        run: npm install --prefix vscode-extension ./react-import-sorter-*.tgz --no-save

      - name: Build extension
        run: npm run vscode:build

      - name: Install vscode-cli
        run: npm install -g vsce

      - name: Package extension
        working-directory: vscode-extension
        run: vsce package

      - name: Publish to Marketplace
        working-directory: vscode-extension
        run: vsce publish -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: vscode-extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
